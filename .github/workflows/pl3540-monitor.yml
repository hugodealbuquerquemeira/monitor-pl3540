name: Monitor PL 3540/2026

on:
  # Horarios em UTC. Brasilia = UTC-3.
  # Minutos :17 e :47 de proposito: o agendador do GitHub descarta muita
  # coisa agendada no minuto :00, que e a faixa mais concorrida.
  # 10-22 UTC = 07h as 19h de Brasilia, de segunda a sexta, a cada 30 min.
  schedule:
    - cron: '17,47 10-22 * * 1-5'
  # Permite rodar na mao pelo botao "Run workflow" na aba Actions.
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Enviar WhatsApp mesmo sem novidade (teste do canal)'
        type: boolean
        default: true

# Necessario para o job conseguir commitar o baseline de volta no repo.
permissions:
  contents: write

concurrency:
  group: pl3540-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O script usa somente a biblioteca padrao: nada para instalar.
      - name: Rodar monitor
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          STATE_FILE: state/pl3540_state.json
          # As APIs do Senado e da Camara dao timeout com frequencia a partir
          # dos runners do GitHub (IP fora do Brasil). Timeout curto e mais
          # tentativas rende melhor do que uma espera longa que estoura o job.
          HTTP_TIMEOUT: '20'
          HTTP_TENTATIVAS: '4'
          # Heartbeat em TODA rodada: 2x por hora. Assim o silencio do canal
          # vira sinal de problema, e nao de calmaria na tramitacao.
          FORCE_NOTIFY: '1'
        run: python monitor_pl3540.py

      - name: Commitar baseline (se mudou)
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name 'pl3540-monitor[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/
            git commit -m 'state: atualiza baseline do PL 3540/2026 [skip ci]'
            # Se outra execucao commitou no meio, rebase e tenta de novo.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'baseline atualizado'
          else
            echo 'baseline sem mudanca'
          fi
