name: Monitor SUSEP IRB (lucro mensal)

on:
  # Horarios em UTC. Brasilia = UTC-3.
  # Janela: 21/12/2026 a 02/01/2027, dias uteis, 09h02 / 12h02 / 16h02 BRT.
  # O cron do GitHub nao combina dia-do-mes com dia-da-semana (vira OU),
  # entao o filtro de dia util e de janela (INICIO/FIM) fica no script.
  schedule:
    - cron: '2 12,15,19 21-31 12 *'
    - cron: '2 12,15,19 1-2 1 *'
    # Keep-alive semanal (segunda 10h17 BRT): o GitHub desliga agendamentos de
    # repo publico apos 60 dias sem commit. Commit silencioso ate INICIO, sem WhatsApp.
    - cron: '17 13 * * 1'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Enviar WhatsApp mesmo sem novidade (teste do canal)'
        type: boolean
        default: true
      teste_lucro_mes:
        description: 'TESTE: lucro ficticio do mes-alvo em R$ mi (ex. 35). Vazio = rodada normal'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: susep-irb-monitor
  cancel-in-progress: false

env:
  INICIO: '2026-12-21'
  FIM: '2027-01-02'

jobs:
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit de keep-alive (so antes do INICIO)
        run: |
          set -euo pipefail
          hoje=$(TZ=America/Sao_Paulo date +%F)
          if [[ "$hoje" < "$INICIO" ]]; then
            mkdir -p state
            echo "$hoje" > state/keepalive.txt
            git config user.name 'susep-irb-monitor[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/keepalive.txt
            git commit -m "keepalive $hoje [skip ci]" || exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Ja passou de INICIO=$INICIO; keep-alive desnecessario."
          fi

  check:
    if: github.event_name != 'schedule' || github.event.schedule != '17 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar monitor
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          STATE_FILE: state/susep_irb_state.json
          # Mes a monitorar (AAAAMM). Lucro do mes = acumulado deste - acumulado do anterior.
          MES_ALVO: '202610'
          SUSEP_FIP: '31623'
          # Consenso de lucro liquido do trimestre do MES_ALVO (4Q26), em R$ mi
          CONSENSO_TRI_MI: '158'
          DIAS_UTEIS: '1'
          # Heartbeat em toda rodada enquanto o mes nao sai. Depois do alerta, silencio.
          HEARTBEAT: '1'
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify && '1' || '' }}
          TESTE_LL_MES: ${{ inputs.teste_lucro_mes }}
          HTTP_TIMEOUT: '30'
          HTTP_TENTATIVAS: '4'
        run: python monitor_susep_irb.py

      - name: Commitar estado (se mudou)
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name 'susep-irb-monitor[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/
            git commit -m 'state: atualiza estado do monitor SUSEP IRB [skip ci]'
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'estado sem mudanca'
          fi
